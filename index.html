<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Saree Embassy - Business Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .brand-logo-box {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
    }
    .saree-img-box {
      width: 90px;
      height: 135px;
      object-fit: cover;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      margin-top: 6px;
    }
    .pdf-render-canvas {
      width: 800px !important;
      max-width: none !important;
      background-color: #ffffff !important;
    }
  </style>
</head>
<body class="bg-amber-50/30 text-gray-800 font-sans antialiased">

  <div class="flex flex-col md:flex-row min-h-screen">
    <aside class="w-full md:w-64 bg-amber-900 text-amber-100 flex flex-col p-4 md:p-5 space-y-4 shrink-0">
      <h1 class="text-xl md:text-2xl font-serif font-bold text-amber-300">The Saree Embassy</h1>
      <nav class="flex md:flex-col overflow-x-auto space-x-2 md:space-x-0 md:space-y-3 pb-2 md:pb-0">
        <button onclick="switchTab('orders')" class="whitespace-nowrap text-left py-2 px-3 rounded hover:bg-amber-800 transition text-sm md:text-base">Orders & Invoice</button>
        <button onclick="switchTab('inventory')" class="whitespace-nowrap text-left py-2 px-3 rounded hover:bg-amber-800 transition text-sm md:text-base">Inventory & Pricing</button>
        <button onclick="switchTab('analytics')" class="whitespace-nowrap text-left py-2 px-3 rounded hover:bg-amber-800 transition text-sm md:text-base">Sales Analytics</button>
        <button onclick="switchTab('customers')" class="whitespace-nowrap text-left py-2 px-3 rounded hover:bg-amber-800 transition text-sm md:text-base">Customers</button>
      </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-4 md:p-8">
      
      <section id="tab-orders" class="tab-content">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 md:mb-6 gap-3">
          <h2 class="text-xl md:text-2xl font-bold font-serif text-amber-950">Create New Invoice</h2>
          <button type="button" onclick="createNewOrder()" class="bg-amber-900 text-amber-100 hover:bg-amber-950 px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 shadow-sm">
            <span>+</span> Create New Order
          </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          
          <div class="bg-white p-5 rounded-xl shadow-sm border border-amber-100 lg:col-span-1 space-y-4">
            <h3 class="font-semibold text-lg text-amber-900">Customer Details</h3>
            <form id="orderForm" onsubmit="generateInvoice(event)" class="space-y-4">
              <input type="text" id="custName" placeholder="Customer Name" class="w-full border p-3 rounded text-base" required>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <input type="tel" id="custPhone1" placeholder="Primary Phone" class="w-full border p-3 rounded text-base" required>
                <input type="tel" id="custPhone2" placeholder="Secondary Phone" class="w-full border p-3 rounded text-base">
              </div>
              <textarea id="custAddress" placeholder="Delivery Address" class="w-full border p-3 rounded text-base h-20" required></textarea>

              <div class="border-t pt-4 space-y-3">
                <div class="flex justify-between items-center mb-2">
                  <h3 class="font-semibold text-base text-amber-900">Saree Items & Photos</h3>
                  <button type="button" onclick="addItemRow()" class="text-xs bg-amber-100 text-amber-900 font-bold px-2 py-1 rounded hover:bg-amber-200">+ Add Item</button>
                </div>
                
                <div id="itemsContainer" class="space-y-3">
                  <div class="item-row bg-amber-50/50 p-3 rounded border border-amber-100 space-y-2 relative">
                    <input type="text" placeholder="Saree Type / Design Name" class="saree-name w-full border p-2 rounded text-base" required>
                    <div class="space-y-1">
                      <label class="text-xs font-semibold text-gray-600">Upload Photo:</label>
                      <input type="file" accept="image/*" class="saree-photo w-full text-xs border p-1 rounded bg-white" onchange="previewImage(this)">
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                      <input type="number" placeholder="Original Price" class="saree-orig-price w-full border p-2 rounded text-base" required>
                      <input type="number" placeholder="Discount Price" class="saree-disc-price w-full border p-2 rounded text-base" required>
                      <input type="number" placeholder="Qty" value="1" min="1" class="saree-qty w-full border p-2 rounded text-base" required>
                    </div>
                  </div>
                </div>

                <div class="pt-2">
                  <label class="text-xs font-semibold text-amber-900">Delivery Cost (LKR):</label>
                  <input type="number" id="deliveryCostInput" value="0" min="0" placeholder="Delivery Cost" class="w-full border p-3 rounded text-base mt-1" required>
                </div>
              </div>

              <button type="submit" id="saveBtn" class="w-full bg-amber-800 text-white py-3 rounded font-medium hover:bg-amber-900 active:scale-95 transition">Generate & Save Live</button>
            </form>
          </div>

          <div class="bg-white p-5 rounded-xl shadow-sm border border-amber-100 lg:col-span-2 overflow-x-auto">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
              <h3 class="font-semibold text-lg text-amber-900">Invoice Preview</h3>
              <div class="flex space-x-2 w-full sm:w-auto">
                <button onclick="downloadPDF()" class="flex-1 sm:flex-none bg-amber-700 text-white px-4 py-2 rounded text-sm hover:bg-amber-800">Download PDF</button>
                <button onclick="shareWhatsAppPDF()" class="flex-1 sm:flex-none bg-emerald-600 text-white px-4 py-2 rounded text-sm hover:bg-emerald-700 flex items-center justify-center gap-1">
                  <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.893 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
                  Share PDF via WhatsApp
                </button>
              </div>
