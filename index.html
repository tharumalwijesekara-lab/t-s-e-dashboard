<script>
  // Your Google Apps Script Web App URL
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzi9XxpdFjsvRRPwHl0RGY6wiizgJuyRk6r7jM7UgPeXDZoVQ_JD7rTFDZizwQcyzSX/exec";

  // Fetch and display customers in the Customer Directory
  async function renderCustomers() {
    const custTbody = document.getElementById('customerTableBody');
    if (!custTbody) return;

    custTbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-400">Loading live data from Google Sheets...</td></tr>`;

    try {
      const res = await fetch(GOOGLE_SCRIPT_URL, {
        method: "GET",
        redirect: "follow" // CRITICAL: Follows Google Apps Script redirects
      });

      const textData = await res.text();
      let data;
      
      try {
        data = JSON.parse(textData);
      } catch (parseError) {
        throw new Error("Invalid response received from Google Sheets.");
      }

      if (!Array.isArray(data) || data.length === 0) {
        custTbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-400">No orders found in Google Sheet.</td></tr>`;
        return;
      }

      custTbody.innerHTML = "";
      data.forEach(item => {
        const row = document.createElement("tr");
        row.className = "border-b border-amber-100 hover:bg-amber-50/50 text-amber-900";
        row.innerHTML = `
          <td class="p-3 font-medium">${item.invNo || ''}</td>
          <td class="p-3">${item.date || ''}</td>
          <td class="p-3 font-medium">${item.name || ''}</td>
          <td class="p-3 text-xs whitespace-pre-line">${item.phone1 || ''}${item.phone2 ? '\n' + item.phone2 : ''}\n${item.address || ''}</td>
          <td class="p-3 text-xs">${item.itemsSummary || ''}</td>
          <td class="p-3 font-bold text-emerald-800">LKR ${(item.grandTotal || 0).toLocaleString()}</td>
          <td class="p-3">
            <span class="px-2 py-1 rounded text-xs font-semibold ${item.paymentStatus === 'Paid' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
              ${item.paymentStatus || 'Pending'}
            </span>
          </td>
        `;
        custTbody.appendChild(row);
      });

    } catch (err) {
      console.error("Fetch Error:", err);
      custTbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-red-500 font-semibold">Failed to load Google Sheets data. Please check your network or deployment permissions.</td></tr>`;
    }
  }

  // Save new order / invoice to Google Sheets
  async function saveInvoiceToSheet(payload) {
    try {
      payload.action = "addOrder";
      
      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'cors',
        redirect: 'follow', // CRITICAL: Follows redirects on POST
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Prevents CORS preflight issues
        body: JSON.stringify(payload)
      });

      console.log("Invoice successfully saved to Google Sheets");
      renderCustomers(); // Refresh the directory
    } catch (err) {
      console.error("Error saving invoice to sheet:", err);
      alert("Failed to save order to Google Sheets. Check browser console for details.");
    }
  }

  // Update payment or fulfillment status in Google Sheets
  async function updateOrderStatus(invNo, field, value) {
    try {
      const payload = {
        action: "updateOrder",
        invNo: invNo,
        field: field,
        value: value
      };

      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'cors',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      console.log(`Updated ${field} for ${invNo}`);
      renderCustomers();
    } catch (err) {
      console.error("Error updating order status:", err);
    }
  }

  // Auto-load customers on page load
  document.addEventListener("DOMContentLoaded", () => {
    renderCustomers();
    
    // Attach event to Sync Now button if it exists
    const syncBtn = document.getElementById("syncNowBtn");
    if (syncBtn) {
      syncBtn.addEventListener("click", renderCustomers);
    }
  });
</script>
